<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LifeOS - Connecting...</title>
  </head>
  <body>
    <p>Connecting to LifeOS...</p>
    <script>
      console.log('Callback page loaded');
      console.log('Full URL:', window.location.href);
      console.log('Hash:', window.location.hash);
      
      const hash = window.location.hash;
      
      if (hash && hash.includes('access_token=')) {
        const params = new URLSearchParams(hash.substring(1));
        const token = params.get('access_token');
        console.log('Token found:', token ? 'yes (length: ' + token.length + ')' : 'no');
        
        if (token) {
          localStorage.setItem('ticktick_oauth_token', token);
          window.location.href = '/lifeos/?sync=success';
        } else {
          window.location.href = '/lifeos/?sync=error';
        }
      } else if (hash && hash.includes('error=')) {
        console.log('OAuth error in hash');
        window.location.href = '/lifeos/?sync=error';
      } else {
        console.log('No token or error in hash');
        window.location.href = '/lifeos/?sync=error';
      }
    </script>
  </body>
</html>
