<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LifeOS - Connecting...</title>
    <style>
      body { font-family: Arial; padding: 20px; background: #1A1A2E; color: white; }
      .error { color: #ff6b6b; }
      .success { color: #51cf66; }
    </style>
  </head>
  <body>
    <h2 id="status">Processing...</h2>
    <p id="message"></p>
    <p id="url"></p>
    <script>
      const statusEl = document.getElementById('status');
      const messageEl = document.getElementById('message');
      const urlEl = document.getElementById('url');
      
      console.log('Callback URL:', window.location.href);
      console.log('Hash:', window.location.hash);
      
      const hash = window.location.hash;
      const search = window.location.search;
      
      urlEl.textContent = 'URL: ' + window.location.href;
      
      if (search && search.includes('error=')) {
        const params = new URLSearchParams(search);
        const error = params.get('error');
        const errorDesc = params.get('error_description');
        statusEl.textContent = 'OAuth Error';
        statusEl.className = 'error';
        messageEl.textContent = 'Error: ' + error + '\n' + (errorDesc || '');
        console.log('OAuth Error:', error, errorDesc);
      } else if (hash && hash.includes('access_token=')) {
        const params = new URLSearchParams(hash.substring(1));
        const token = params.get('access_token');
        if (token) {
          statusEl.textContent = 'Success!';
          statusEl.className = 'success';
          messageEl.textContent = 'Token received. Redirecting...';
          localStorage.setItem('ticktick_oauth_token', token);
          setTimeout(() => { window.location.href = '/lifeos/?sync=success'; }, 1500);
        } else {
          statusEl.textContent = 'Error';
          statusEl.className = 'error';
          messageEl.textContent = 'No token found in hash';
          setTimeout(() => { window.location.href = '/lifeos/?sync=error'; }, 5000);
        }
      } else {
        statusEl.textContent = 'Error';
        statusEl.className = 'error';
        messageEl.textContent = 'No token or error found. Redirecting in 5 seconds...';
        setTimeout(() => { window.location.href = '/lifeos/?sync=error'; }, 5000);
      }
    </script>
  </body>
</html>
